services:
  - type: web
    name: long-form-design-studio
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2
      - key: AUTO_QC
        value: "true"
      - key: QC_MAX_REVISIONS
        value: "1"
      - key: MAX_SOURCE_CHARS
        value: "800000"
      - key: APP_ACCESS_CODE
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: long-form-design-studio-db
          property: connectionString

databases:
  - name: long-form-design-studio-db
    plan: free
    region: singapore
