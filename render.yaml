services:
  - type: web
    name: long-form-design-studio
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2
      - key: OPENAI_PAGE_TIMEOUT_MS
        value: "120000"
      - key: OPENAI_PROMPT_CACHE_KEY
        value: lfds-v1.3.0-editorial-layout
      - key: AUTO_GENERATE_IMAGES
        value: "true"
      - key: AUTO_ANALYZE_FOCAL_POINT
        value: "false"
      - key: EXTRACT_PDF_IMAGES
        value: "true"
      - key: PDF_IMAGE_EXTRACT_LIMIT
        value: "36"
      - key: SKIP_AI_QC_ON_STRUCTURAL_FAIL
        value: "true"
      - key: AUTO_QC
        value: "true"
      - key: QC_MAX_REVISIONS
        value: "0"
      - key: QC_PAGE_REDESIGN_ROUNDS
        value: "2"
      - key: QC_PAGE_REDESIGN_MAX_PAGES
        value: "60"
      - key: MAX_SOURCE_CHARS
        value: "800000"
      - key: VISUAL_PREFLIGHT
        value: "true"
      - key: VISUAL_PREFLIGHT_MAX_PAGES
        value: "12"
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: ALLOWED_EMAIL_DOMAINS
        value: recykal.com
      - key: REQUIRE_APPROVER_FOR_FINAL_EXPORT
        value: "false"
      - key: REQUIRE_DURABLE_STORAGE
        value: "true"
      - key: APP_ACCESS_CODE
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: long-form-design-studio-db
          property: connectionString

databases:
  - name: long-form-design-studio-db
    plan: free
    region: singapore
